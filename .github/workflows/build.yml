name: Build Tokyo Ghoul RPG 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build mod
        run: gradle --no-daemon build

      - name: Show build output
        run: ls -lah build/libs

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TokyoGhoulRPG-2.0.0
          path: build/libs/*.jar
          if-no-files-found: error
